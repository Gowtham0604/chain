<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Merge | Premium Puzzle</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Background elements -->
    <div class="bg-gradient"></div>
    
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- HUD -->
    <div id="hud" class="hud-container hidden">
       <div class="stat-box">
         <span class="label">SCORE</span>
         <span id="scoreEl" class="value">0</span>
       </div>
       <div class="stat-box right">
         <span class="label">BEST</span>
         <span id="bestEl" class="value highlight">0</span>
       </div>
    </div>
    
    <!-- Main Menu & Game Over Screen -->
    <div id="menu" class="menu-container">
      <div class="glow-orb"></div>
      
      <h1 id="menuTitle" class="game-title">NEON<br>MERGE</h1>
      <p id="menuDesc" class="game-desc">Tap groups of matching numbers to merge them and trigger <span class="highlight-text">massive combos</span>!</p>
      
      <button id="startBtn" class="btn primary">PLAY NOW</button>
      <button id="toggleAudioBtn" class="btn secondary">🔊 AUDIO: ON</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
